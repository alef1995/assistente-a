name: Zuri para Windows

# Monta o instalador ZuriSetup.exe numa máquina Windows do GitHub.
# Roda quando a pasta zuri-pc muda, ou quando o workflow do Android avisa (envio por projeto.b64).
on:
  push:
    branches: [main]
    paths: ["zuri-pc/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-pc
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: zuri-pc
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: zuri-pc/requirements.txt

      - name: Instalar bibliotecas
        run: pip install -r requirements.txt

      - name: Testar o interpretador de comandos
        run: python test_parser.py

      - name: Baixar modelo de voz offline (portugues)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://alphacephei.com/vosk/models/vosk-model-small-pt-0.3.zip -OutFile modelo.zip
          Expand-Archive modelo.zip -DestinationPath modelo_tmp
          Move-Item modelo_tmp\vosk-model-small-pt-0.3 model

      - name: Montar o programa (PyInstaller)
        run: >
          pyinstaller main.py --name Zuri --noconsole --noconfirm --icon zuri.ico
          --add-data "zuri/ui;zuri/ui" --add-data "model;model"
          --collect-all vosk --collect-all webview --collect-all _sounddevice_data
          --collect-all pythonnet --collect-all clr_loader --collect-data speech_recognition
          --collect-submodules pycaw --collect-submodules comtypes
          --hidden-import pyttsx3.drivers --hidden-import pyttsx3.drivers.sapi5

      - name: Montar o instalador (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $env:ZURI_VERSION = "1.0.${{ github.run_number }}"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Mover a etiqueta pc-latest
        shell: bash
        run: |
          git tag -f pc-latest
          git push -f origin pc-latest

      - name: Publicar o instalador
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pc-latest
          name: "Zuri para Windows - versao ${{ github.run_number }}"
          make_latest: false
          files: zuri-pc/Output/ZuriSetup.exe
          body: |
            **Instalar no PC:** baixe `ZuriSetup.exe` abaixo e abra. Não precisa ser administrador.

            Se o Windows mostrar "O Windows protegeu o computador", clique em **Mais informações** › **Executar assim mesmo**
            (aparece porque o instalador não tem assinatura digital paga).
